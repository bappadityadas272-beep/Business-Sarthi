[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "business-sarthi-backend"
version = "0.1.0"
description = "Business Sarthi backend (prototype)"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.163.1",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.3",
  "SQLAlchemy==2.1.8",
  "alembic==1.20.1",
  "PyYAML==6.0.3",
  "httpx==0.28.1",
  "PyJWT==2.15.1",
  "APScheduler==3.11.3",
  "numpy==2.5.5",
  "pandas==3.1.1",
  "scikit-learn==1.9.1",
  "statsmodels==0.15.0",
  "lightgbm==4.7.0",
  "joblib==1.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.5",
  "matplotlib==3.11.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# EXE: Windows bind mounts into Docker show every file as executable, so these rules are noise.
extend-ignore = ["EXE"]

[tool.ruff.lint.isort]
# the local alembic/ migrations folder would otherwise make ruff treat the alembic package as first-party
known-third-party = ["alembic"]
