    Every second day logged (45/90 = 0.5). On logged days sales are 500 against P50 1000: 0.5. Missing days are
    not zero sales; the comparison uses logged days only and is still below 0.6. Pivot, but with low confidence.
  pattern: alternate
  blocks:
    - {logged: 15, sales: 500, purchases: 425, expenses: 1000}
    - {logged: 15, sales: 500, purchases: 425, expenses: 1000}
    - {logged: 15, sales: 500, purchases: 425, expenses: 1000}
  p50_per_day: 1000
  emi: null
  cash: null
  expect:
    decision: pivot
    reasons: [revenue_vs_p50]
    actions: [cut_fixed_costs, log_daily]
    confidence: low
    indicators: {revenue_vs_p50: 0.5, data_completeness: 0.5}

- name: half_the_days_missing_and_sales_good
  why: >
    Every second day logged with the healthy numbers of the first scenario. Revenue stays 1.1 (missing days do
    not count as zero), but completeness 0.5 is below 0.7: no grow on thin data. Hold, low confidence.
  pattern: alternate
  blocks:
    - {logged: 15, sales: 1000, purchases: 850, expenses: 2000}
    - {logged: 15, sales: 1100, purchases: 935, expenses: 2000}
    - {logged: 15, sales: 1200, purchases: 1020, expenses: 2000}
  p50_per_day: 1000
  emi: 1000
  cash: 50000
  expect:
    decision: hold
    reasons: [data_completeness]
    actions: [log_daily]
    confidence: low
    indicators: {revenue_vs_p50: 1.1, dscr: 2.95, data_completeness: 0.5}

