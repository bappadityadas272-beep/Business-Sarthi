    Nothing was logged. Every indicator is unknown and completeness is 0. Unknown never triggers pivot or grow.
    Hold with low confidence; the only advice is to log daily.
  blocks:
    - {logged: 0, sales: 0, purchases: 0, expenses: 0}
    - {logged: 0, sales: 0, purchases: 0, expenses: 0}
    - {logged: 0, sales: 0, purchases: 0, expenses: 0}
  p50_per_day: 1000
  emi: 5000
  cash: 10000
  expect:
    decision: hold
    reasons: [data_completeness, revenue_vs_p50, dscr]
    actions: [log_daily]
    confidence: low
    indicators: {revenue_vs_p50: null, dscr: null, growth_rate: null, cash_runway_days: null, data_completeness: 0.0}
