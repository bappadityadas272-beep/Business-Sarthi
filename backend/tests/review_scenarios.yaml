    Same loss-making shop, cash unknown. The runway rule is skipped (no pivot on a guess) and a note says so.
    Nothing else triggers pivot. Hold.
  blocks:
    - {logged: 30, sales: 1000, purchases: 950, expenses: 3000}
    - {logged: 30, sales: 1000, purchases: 950, expenses: 3000}
    - {logged: 30, sales: 1000, purchases: 950, expenses: 3000}
  p50_per_day: 1000
  emi: null
  cash: null
  expect:
    decision: hold
    reasons: [growth_rate]
    notes: [cash_unknown_runway_rule_skipped]
    indicators: {cash_runway_days: null}

- name: strong_sales_but_cash_figure_negative
  why: >
    The healthy first scenario, but the cash figure is -20000 while the period is cash-positive. Runway is defined
    only for a negative flow, so it is unknown; the human chose (DEC-65) to add a note to check the opening cash
    and let the other indicators decide. They all say grow.
  blocks:
    - {logged: 30, sales: 1000, purchases: 850, expenses: 2000}
    - {logged: 30, sales: 1100, purchases: 935, expenses: 2000}
    - {logged: 30, sales: 1200, purchases: 1020, expenses: 2000}
  p50_per_day: 1000
  emi: 1000
  cash: -20000
  expect:
    decision: grow
    notes: [cash_negative_check_opening_cash]
    indicators: {cash_runway_days: null, dscr: 2.95}

- name: strong_sales_but_burning_cash
  why: >
    Sales 1200 against P50 1000 (1.2), but purchases 1250 a day exceed sales. No loan. Net flow
    (-50 x 90 - 6000)/90 = -116.67 a day; cash 2000 lasts 17.1 days, below 30. Pivot despite strong sales.
  blocks:
    - {logged: 30, sales: 1200, purchases: 1250, expenses: 2000}
    - {logged: 30, sales: 1200, purchases: 1250, expenses: 2000}
    - {logged: 30, sales: 1200, purchases: 1250, expenses: 2000}
